# Render 배포 설정 (https://render.com)
#
# 이 서비스 하나가 게임 파일과 온라인 대전 중계를 모두 맡습니다.
# relay.py 가 game/ 을 정적 서빙하므로 주소가 하나로 끝납니다.
services:
  - type: web
    name: muje-chess
    runtime: python
    region: singapore          # 한국에서 가장 가깝다. 실시간 대전이라 지연이 곧 체감이다.
    plan: free
    # 배포되는 브랜치. 대시보드 설정이 실제로 이기지만, 여기가 어긋나 있으면
    # 나중에 블루프린트를 다시 적용할 때 엉뚱한 브랜치로 붙는다.
    # (2026-09-19 확인: 배포본이 원본 main 의 내용과 같았다)
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python server/relay.py
    healthCheckPath: /healthz
    envVars:
      # 대국 통계를 수퍼베이스에 적을 때 쓴다. 값은 여기 적지 않고
      # 렌더 대시보드의 Environment 에서 넣는다 (sync: false 가 그 뜻이다).
      # 둘 다 비어 있으면 통계는 조용히 버려진다 — 게임은 그대로 돌아간다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
